<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mourncrown — ผู้ร่วมสร้างตำนาน</title>
<style>
  :root { --bg: #120d08; --card: #1e160d; --line: #5a4422; --gold: #ffd84a; --text: #f3e6c4; --dim: #a89878; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, #2a1c0c, var(--bg) 70%); background-color: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; min-height: 100vh; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0; text-align: center; font-size: clamp(24px, 6vw, 36px); color: var(--gold); letter-spacing: .5px; text-shadow: 0 0 18px rgba(255, 190, 40, .35); }
  .sub { text-align: center; color: var(--dim); margin: 6px 0 26px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  section h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  section h2 small { color: var(--dim); font-weight: 400; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .n { padding: 3px 10px; border-radius: 6px; border: 1px solid; font-size: 14px; }
  .t1, .t2 { border-color: #b87a4a; color: #e8c0a0; background: #2a1a10; }
  .t3, .t4 { border-color: #b8c4d4; color: #eef4ff; background: #1e2028; }
  .t5, .t6 { border-color: #e8b83a; color: #fff0a0; background: #2a1e08; box-shadow: 0 0 8px rgba(232, 184, 58, .3); }
  .t7 { border-color: #ffd84a; color: #fff; background: #24103a; box-shadow: 0 0 12px rgba(255, 216, 74, .5); font-weight: 700; }
  .empty { text-align: center; color: var(--dim); padding: 30px 0; }
  .lang { position: absolute; top: 12px; right: 16px; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
</style>
</head>
<body>
<button class="lang" id="lang">EN</button>
<main>
  <h1>👑 ผู้ร่วมสร้างตำนาน</h1>
  <p class="sub" id="sub">ขอบคุณทุกคนที่ช่วยให้ Mourncrown เดินต่อไปได้</p>
  <div id="wall"><p class="empty">กำลังโหลด…</p></div>
</main>
<script>
const SERVER = 'https://mourncrown.egowenit.workers.dev';
const T = {
  th: { sub: 'ขอบคุณทุกคนที่ช่วยให้ Mourncrown เดินต่อไปได้', tier: 'ขั้น', empty: 'ยังไม่มีรายชื่อ — เปิดในช่วง OBT', err: 'โหลดไม่ได้ ลองใหม่อีกครั้ง', ppl: 'คน', btn: 'EN', title: '👑 ผู้ร่วมสร้างตำนาน' },
  en: { sub: 'Thank you to everyone who keeps Mourncrown going', tier: 'Tier', empty: 'No names yet — opens during OBT', err: 'Could not load, please try again', ppl: 'people', btn: 'TH', title: '👑 Legend Makers' },
};
let lang = 'th', data = null;
try { lang = localStorage.getItem('lang') === 'en' ? 'en' : 'th'; } catch { /* storage blocked */ }
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function draw() {
  const L = T[lang]; document.querySelector('h1').textContent = L.title; document.getElementById('sub').textContent = L.sub; document.getElementById('lang').textContent = L.btn;
  const w = document.getElementById('wall');
  if (data === 'err') { w.innerHTML = `<p class="empty">${L.err}</p>`; return; }
  if (!data) return;
  if (!data.length) { w.innerHTML = `<p class="empty">${L.empty}</p>`; return; }
  let h = '';
  for (let t = 7; t >= 1; t--) {
    const list = data.filter(x => x.tier === t); if (!list.length) continue;
    h += `<section><h2><span>${L.tier} ${t}</span><small>${list.length} ${L.ppl}</small></h2><div class="names">${list.map(x => `<span class="n t${t}">${esc(x.name)}</span>`).join('')}</div></section>`;
  }
  w.innerHTML = h;
}
document.getElementById('lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; draw(); };
fetch(SERVER + '/supporters').then(r => r.json()).then(d => { data = d.list || []; draw(); }).catch(() => { data = 'err'; draw(); });
draw();
</script>
</body>
</html>
