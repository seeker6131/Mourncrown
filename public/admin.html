<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mourncrown หลังบ้าน</title>
<style>
  /* The back office (director): everything in the game, for the admin accounts only. The server checks every request
     (server/worker.ts /admin/*); this page holds no secret — it uses the game's own sign-in on this device.
     Layout (director 16 Nov): a side menu in clear groups, every page says what it is for, "things to look at" first. */
  :root { --bg:#f3f5fa; --card:#ffffff; --line:#e3e7f0; --text:#1f2433; --dim:#7a8299; --gold:#c98a00; --red:#e04848; --green:#1f9d63; --blue:#4a6cf7;
    --side:#ffffff; --soft:#eef2ff; --th:#f6f8fc; --inp:#ffffff; --hover:#f2f5ff; --shadow:0 1px 3px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05); }
  :root[data-theme="dark"] { --bg:#11131a; --card:#1a1d27; --line:#2a2f3d; --text:#e8ebf3; --dim:#8b93a8; --gold:#ffcc4a; --red:#ff6a5a; --green:#4cd08a; --blue:#7d95ff;
    --side:#161922; --soft:#232a45; --th:#20242f; --inp:#12151d; --hover:#222838; --shadow:none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: .5px; padding: 2px 8px 14px; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--blue); display: inline-block; } .brand small { font-weight: 500; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .grp { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; padding: 12px 10px 4px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--text); border-radius: 10px; padding: 7px 10px; font: 500 14px system-ui; cursor: pointer; text-align: left; }
  nav button:hover { background: var(--hover); }
  nav button.on { background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(74,108,247,.3); }
  nav button .n { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; background: #f5a623; color: #fff; }
  nav button .n:empty { display: none; }
  .foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); display: grid; gap: 8px; }
  .foot .live { color: var(--green); } .foot .row { margin: 0; gap: 6px; }
  .wrap { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 24px 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 20px; } .top .sub { color: var(--dim); font-size: 13px; }
  .top .uid { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .desc { margin: 0 24px 4px; padding: 10px 14px; background: var(--soft); border-radius: 12px; font-size: 13px; color: var(--text); }
  .btn { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--hover); } .btn:disabled { opacity: .45; cursor: default; }
  .btn.red { background: #fdecec; border-color: #f4bcbc; color: #b42318; } .btn.green { background: var(--blue); border-color: var(--blue); color: #fff; }
  :root[data-theme="dark"] .btn.red { background: #4a1d1d; border-color: #7a2e2e; color: #ffb4a8; }
  main { padding: 10px 24px 48px; max-width: 1280px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .stat, .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .v { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.2; } .stat .k { color: var(--dim); font-size: 12px; }
  .stat .k:first-child { font-weight: 600; color: var(--text); font-size: 13px; margin-bottom: 4px; }
  .alerts { border-left: 4px solid #f5a623; margin-bottom: 16px; } .alerts h3 { margin: 0 0 8px; font-size: 16px; }
  .alert { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--th); margin-top: 6px; font-size: 13px; cursor: pointer; }
  .alert:hover { background: var(--hover); } .alert b { margin-left: auto; color: var(--blue); font-weight: 600; } .alert.ok { cursor: default; color: var(--green); }
  h2 { font-size: 16px; color: var(--text); margin: 24px 0 10px; }
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  th { background: var(--th); color: var(--dim); font-weight: 600; position: sticky; top: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--th); border: 1px solid var(--line); }
  .tag.vip { background: #efe5ff; color: #6b3fd4; border-color: #dccbff; } .tag.ban { background: #fde2e2; color: #b42318; border-color: #f4bcbc; }
  .tag.mute { background: #fff3d6; color: #9a6700; border-color: #f5dc9a; } .tag.g { background: #e3efff; color: #1d5fc4; border-color: #c4dcff; }
  :root[data-theme="dark"] .tag { color: var(--text); background: var(--th); border-color: var(--line); }
  .bar { height: 8px; background: var(--th); border-radius: 4px; overflow: hidden; margin-top: 8px; } .bar i { display: block; height: 100%; background: var(--green); }
  input, select, textarea, #gNote { background: var(--inp) !important; color: var(--text) !important; border: 1px solid var(--line) !important; border-radius: 9px !important; padding: 7px 10px; font: 14px system-ui; }
  input[type=file] { border: 0 !important; padding: 0; }
  label { font-size: 13px; color: var(--dim); }
  input[type=search] { width: min(320px, 100%); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .dim { color: var(--dim); } .msg { padding: 60px 10px; text-align: center; color: var(--dim); }
  section.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 16px; width: min(780px, 94vw); max-height: 88vh; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15,20,35,.45); }
  .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  .db { padding: 14px 18px; overflow: auto; max-height: calc(88vh - 60px); }
  pre { background: var(--th); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow: auto; max-height: 300px; font-size: 12px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; } .kv div:nth-child(odd) { color: var(--dim); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { width: 100%; padding-bottom: 6px; } .grp { display: none; } nav { display: flex; flex-wrap: wrap; gap: 4px; }
    nav button { width: auto; padding: 7px 10px; font-size: 13px; } .foot { width: 100%; border: 0; padding: 6px 0 0; grid-auto-flow: column; justify-content: start; }
    .top, main { padding-left: 16px; padding-right: 16px; } .desc { margin: 0 16px 4px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i></i>MOURNCROWN <small>หลังบ้าน</small></div>
    <nav id="tabs"></nav>
    <div class="foot">
      <span><span class="live">●</span> สด • <span id="upd">-</span></span>
      <div class="row"><button class="btn" id="pause" title="หยุด/เริ่ม รีเฟรชเอง">⏸ หยุด</button><button class="btn" id="reload" title="โหลดใหม่ (R)">↻</button><button class="btn" id="theme" title="สว่าง / มืด">☾</button></div>
      <span>กด 1–9 เปลี่ยนหน้า • R โหลดใหม่</span>
    </div>
  </aside>
  <div class="wrap">
    <div class="top"><h1 id="ttl">ภาพรวม</h1><span class="sub" id="tsub"></span>
      <span class="uid"><input type="search" id="uid" placeholder="🆔 วางรหัสผู้เล่น (UID)" style="width:min(240px,100%)"><button class="btn green" id="uidGo">🔎 เปิดผู้เล่น / ส่งของ</button></span></div>
    <div class="desc" id="desc"></div>
    <main id="main"><div class="msg">กำลังโหลด...</div></main>
  </div>
</div>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button class="btn" onclick="dlg.close()">ปิด</button></div><div class="db" id="dbody"></div></dialog>
<script>
const SERVER = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).get('srv') === 'local' ? 'http://127.0.0.1:8787' : 'https://mourncrown.egowenit.workers.dev';   // (?srv=local: a local test copy, this machine only)
let token = ''; try { token = JSON.parse(localStorage.getItem('mc_cloud') || 'null')?.token || ''; } catch {}
const $ = id => document.getElementById(id), main = $('main');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => (Number(v) || 0).toLocaleString('th-TH');
const when = t => { if (!t) return '-'; const d = (Date.now() - t) / 1000; if (d < 60) return 'เมื่อกี้'; if (d < 3600) return Math.floor(d / 60) + ' นาทีที่แล้ว'; if (d < 86400) return Math.floor(d / 3600) + ' ชม.ที่แล้ว'; return new Date(t).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); };
const CLS = { novice: 'ชาวบ้าน', sword: 'ดาบ', archer: 'ธนู', mage: 'เวท', cleric: 'ผู้พิทักษ์' };
const tags = r => [r.google ? '<span class="tag g">Google</span>' : '<span class="tag">แขก</span>', (r.vip || 0) > Date.now() ? '<span class="tag vip">VIP</span>' : '', r.banned ? '<span class="tag ban">แบน</span>' : '', (r.muted_until || 0) > Date.now() ? '<span class="tag mute">ปิดแชต</span>' : ''].join(' ');
async function api(path, body) {
  const r = await fetch(SERVER + path, { method: body ? 'POST' : 'GET', headers: { 'x-mc-token': token, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 || r.status === 403) throw new Error('admin');
  return r.json();
}
// the side menu (director 16 Nov): grouped, and every page says what it is for and how to use it
const TABS = [
  ['overview', '📊', 'ภาพรวม', 'ภาพรวม', 'ดูก่อนทุกครั้ง: กล่อง "สิ่งที่ต้องดู" บอกเรื่องที่ควรจัดการ (แตะเพื่อไปหน้านั้น) • ตัวเลขสำคัญของเซิร์ฟ • ใครออนไลน์อยู่ (แตะชื่อเพื่อดูรายละเอียด) • หน้านี้รีเฟรชเองทุก 30 วินาที'],
  ['players', '👥', 'ผู้เล่น', 'ผู้เล่น', 'ค้นหาผู้เล่นด้วยชื่อหรือรหัส (UID) • แตะแถวเพื่อเปิด: ดูของ/ทอง/เพชร, ส่งของให้รายคน, แบน/ปิดแชต, ดูเพื่อนที่ชวน • บัญชีทดสอบซ่อนไว้ (กดปุ่มเพื่อแสดง)'],
  ['reports', '🚩', 'รายงานแชต', 'ผู้เล่น', 'ข้อความแชตที่ผู้เล่นกดรายงาน • ถูกรายงาน 3 คนในวันเดียว = ปิดแชตเอง 1 วัน • แตะแถวเพื่อเปิดผู้เล่นแล้วแบน/ปิดแชตเพิ่ม'],
  ['flags', '🛡', 'กันโกง', 'ผู้เล่น', 'สิ่งที่ระบบกันโกงจับได้ (ทอง/เลเวลพุ่งผิดปกติ, แก้เพชร/VIP เอง) และบันทึกสิ่งที่แอดมินทำ • แตะแถวเพื่อเปิดผู้เล่น'],
  ['pay', '💳', 'เติมเงิน', 'เงิน & เศรษฐกิจ', 'รายได้จริง • ตั้ง QR รับเงิน • เปิด/ปิดระบบเติมเงิน • รายการที่ "ตรวจผ่านแต่ยังไม่ได้เพชร" กดส่งเพชรซ้ำได้'],
  ['econ', '💰', 'เศรษฐกิจ', 'เงิน & เศรษฐกิจ', 'ทองในเกมเฟ้อหรือฝืด • ทองมาจากไหน/ไปไหน • ใครได้ทองมากสุด (แตะเพื่อดูที่มา) • ราคาตลาด • เลือกดู วันนี้ / 7 วัน / 30 วัน'],
  ['market', '🏪', 'ตลาด', 'เงิน & เศรษฐกิจ', 'ของที่ผู้เล่นลงขายในตลาดกลาง ทั้งที่วางขาย ขายแล้ว และหมดเวลา (ดูอย่างเดียว)'],
  ['guilds', '🏛', 'กิลด์', 'ชุมชน', 'รายชื่อกิลด์ทั้งหมด หัวหน้า สมาชิก เลเวลหอกิลด์ คะแนนสัปดาห์ และโล่ (ดูอย่างเดียว)'],
  ['ann', '📢', 'ประกาศในเกม', 'เครื่องมือแอดมิน', 'ข้อความสั้นขึ้นแถบทองใต้ชื่อแผนที่ของทุกคน ไม่บังจอ • ใช้แจ้งปิดปรับปรุง กิจกรรม • ตั้งเวลาแสดงได้ ยกเลิกได้'],
  ['mail', '📬', 'จดหมายถึงทุกคน', 'เครื่องมือแอดมิน', 'ส่งจดหมาย + ของ (ทอง ทรัพยากร ไอเทม) ให้ผู้เล่นทุกคน ใช้แจกรางวัล/ชดเชย • ⚠ ส่งแล้วยกเลิกไม่ได้ • ส่งให้รายคน: ไปที่หน้าผู้เล่น'],
  ['raid', '⚔', 'มอนบุกหมู่บ้าน', 'เครื่องมือแอดมิน', 'มอนบุกหมู่บ้านกลางอัตโนมัติวันละ 3 รอบ (12:00 • 18:00 • 21:00) • แทรกรอบพิเศษ / ยกเลิก • ซ่อมหรือทำให้อาคารกลางพัง (ทดสอบ)'],
  ['move', '🔁', 'ย้ายตัวละคร', 'เครื่องมือแอดมิน', 'ใช้เมื่อผู้เล่นย้ายเครื่องแล้วไม่มีทางเข้าเอง (ปกติผู้เล่นใช้ "📱 โค้ดย้ายเครื่อง" หรือ Google ได้เอง) • บัญชีเดิมจะถูกปิดกันของซ้ำ'],
  ['gw', '🧪', 'ทดสอบกิลด์วอ', 'เครื่องมือแอดมิน', 'สร้างกิลด์บอทไว้ทดสอบสงคราม (ผู้เล่นไม่เห็น) • อัปกิลด์แอดมินเต็มสูบ / คืนค่า • ใส่บอทเป็นเป้า หรือให้บอทบุกกิลด์แอดมิน'],
];
const MAIL_TABS = ['mail', 'ann', 'raid', 'move'];
let tab = 'overview', timer = 0, q = '', sort = 'seen', page = 0, showTests = false, paused = false;
const badges = {};
function drawNav() {
  let g = '', h = '';
  TABS.forEach(([k, ic, n, grp], i) => { if (grp !== g) { g = grp; h += `<div class="grp">${grp}</div>`; } h += `<button data-k="${k}" class="${k === tab ? 'on' : ''}" title="กด ${i < 9 ? i + 1 : ''}"><span>${ic}</span><span>${n}</span><span class="n">${badges[k] || ''}</span></button>`; });
  $('tabs').innerHTML = h;
}
drawNav();
$('tabs').onclick = e => { const k = e.target.closest('button')?.dataset?.k; if (k) go(k); };
function go(k) { tab = k; page = 0; show(); }
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey) return; const n = Number(e.key); if (n >= 1 && n <= 9 && TABS[n - 1]) go(TABS[n - 1][0]); if (e.key === 'r' || e.key === 'R') show(); });
$('reload').onclick = () => show();
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ เริ่ม' : '⏸ หยุด'; if (!paused) show(); };
const setTheme = t => { document.documentElement.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀' : '☾'; try { localStorage.setItem('mc_admin_theme', t); } catch {} };
try { setTheme(localStorage.getItem('mc_admin_theme') || 'light'); } catch { setTheme('light'); }
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
const playerRow = r => `<tr class="click" data-id="${esc(r.id)}"><td>${r.test ? '🧪 ' : ''}${esc(r.name || '(ยังไม่ตั้งชื่อ)')}</td><td>${r.lv ?? '-'}</td><td>${esc(CLS[r.cls] || r.cls || '-')}${r.tier ? ' ร่าง ' + (r.tier + 1) : ''}</td><td>${num(r.gold)}</td><td>${num(r.diamonds)}</td><td>${tags(r)}</td><td>${when(r.seen)}</td><td class="dim">${when(r.created)}</td></tr>`;
const playerTable = rows => `<div class="tw"><table><tr><th>ชื่อ</th><th>Lv</th><th>อาชีพ</th><th>ทอง</th><th>💎</th><th>สถานะ</th><th>เข้าล่าสุด</th><th>สมัคร</th></tr>${rows.map(playerRow).join('') || '<tr><td colspan="8" class="dim">ไม่มี</td></tr>'}</table></div>`;
// ---- 💰 the economy (server/worker.ts /admin/econ + the `econ` ledger): what inflates, where gold comes from, who earns ----
let econDays = 7;
const SRC = { kill: 'ฆ่ามอน', roomKill: 'ฆ่ามอน (แมพรวม)', wbKill: 'บอสเร่ร่อน', botKill: 'ฆ่ามอน', pickup: 'เก็บของดรอป', gather: 'เก็บทรัพยากรในป่า', sell: 'ขายของให้ร้าน', sellJunk: 'ขายของขยะให้ร้าน',
  shopBuy: 'ซื้อของร้าน', autoPotion: 'ซื้อยาอัตโนมัติ', vipBuyPotion: 'ซื้อยา (VIP)', upgradeItem: 'ตีบวกอุปกรณ์', dismantle: 'ย่อยอุปกรณ์', craft: 'ตีอุปกรณ์ (โรงตีเหล็ก)', cook: 'ทำอาหาร', brew: 'ปรุงยา',

      $('rGo').onclick = async () => { const m = Number($('rMins').value) || 0; if (!confirm('ตั้งมอนบุกหมู่บ้านกลางในอีก ' + m + ' นาที?')) return; await api('/admin/raid', { mins: m }); show(); };

      if ($('aClear')) $('aClear').onclick = async () => { await api('/admin/ann', { text: '', mins: 0 }); show(); };
      const pick = [], draw = () => { $('mList').textContent = pick.length ? 'จะส่ง: ' + pick.map(p => `${p.name} x${p.qty}`).join(', ') : 'ยังไม่ได้เลือกไอเทม'; };
      $('mAdd').onclick = () => { const v = $('mItem').value, m = v.match(/\[([^\]]+)\]$/), it = (window.ITEMS || []).find(i => i.id === (m ? m[1] : v) || i.name === v); if (!it) { alert('ไม่พบไอเทมนี้ — เลือกจากรายการที่ขึ้นมา'); return; } pick.push({ id: it.id, name: it.name, qty: Math.max(1, Math.min(999, Number($('mQty').value) || 1)) }); $('mItem').value = ''; draw(); };
      $('mSend').onclick = async () => {
        const b = { title: $('mTitle').value.trim(), text: $('mText').value.trim(), gold: Number($('mGold').value) || 0, wood: Number($('mWood').value) || 0, stone: Number($('mStone').value) || 0, food: Number($('mFood').value) || 0, items: pick.map(p => ({ id: p.id, qty: p.qty })), days: Number($('mDays').value) || 0 };
        if (!b.title) { alert('ใส่หัวข้อก่อน'); return; }
        const sum = [b.gold && '💰 ' + num(b.gold), b.wood && '🪵 ' + num(b.wood), b.stone && '🪨 ' + num(b.stone), b.food && '🍖 ' + num(b.food), ...pick.map(p => `${p.name} x${p.qty}`)].filter(Boolean);
        if (!confirm(`ส่งหาผู้เล่น "ทุกคน":\n${b.title}\n${sum.join('\n') || '(จดหมายเปล่า ไม่มีของ)'}\n\nส่งแล้วยกเลิกไม่ได้ — ยืนยัน?`)) return;
        const r = await api('/admin/mailall', b); if (r.ok) { alert('✅ ส่งแล้ว\n' + r.text); show(); } else alert('ส่งไม่สำเร็จ: ' + r.error);
      };
    } else if (tab === 'guilds') {
      const d = await api('/admin/guilds');
      main.innerHTML = `<div class="tw"><table><tr><th>กิลด์</th><th>หัวหน้า</th><th>สมาชิก</th><th>หอกิลด์</th><th>คะแนนสัปดาห์</th><th>โล่</th><th>สร้างเมื่อ</th></tr>${d.rows.map(g => `<tr><td>${esc(g.name)}</td><td>${esc(g.leader_name || '-')}</td><td>${g.members}/10</td><td>Lv${g.hall}</td><td>${num(g.score)}</td><td>${g.shield > Date.now() ? '🛡 อีก ' + Math.ceil((g.shield - Date.now()) / 3600000) + ' ชม.' : '-'}</td><td class="dim">${when(g.at)}</td></tr>`).join('') || '<tr><td colspan="7" class="dim">ยังไม่มีกิลด์</td></tr>'}</table></div>`;
    } else if (tab === 'market') {
      const d = await api('/admin/market'), RAR = ['Common', 'Uncommon', 'Rare', 'Super Rare', 'Legend', 'SL'];
      main.innerHTML = `<div class="tw"><table><tr><th>ของ</th><th>ระดับ</th><th>ราคา</th><th>ผู้ขาย</th><th>สถานะ</th><th>ลงขาย</th></tr>${d.rows.map(m => { let it = {}; try { it = JSON.parse(m.item); } catch {} const st = m.status === 'sold' ? '✅ ขายแล้ว' : m.status === 'open' && m.until > Date.now() ? '🟢 วางขาย' : m.status === 'open' ? '⌛ หมดเวลา' : esc(m.status); return `<tr><td>${esc(it.id)}${it.upg ? ' +' + it.upg : ''}${it.qty > 1 ? ' x' + it.qty : ''}</td><td>${RAR[m.rar] || m.rar}</td><td>💰 ${num(m.price)}</td><td>${esc(m.seller_name)}</td><td>${st}</td><td class="dim">${when(m.at)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="dim">ยังไม่มีของขาย</td></tr>'}</table></div>`;
    } else if (tab === 'reports') {
      const d = await api('/admin/reports');
      main.innerHTML = `<div class="tw"><table><tr><th>เมื่อ</th><th>ผู้ถูกรายงาน</th><th>ข้อความ</th><th>ห้อง</th><th>คนรายงาน</th><th>ปิดแชตอยู่</th></tr>${d.rows.map(r => `<tr class="click" data-id="${esc(r.target)}"><td class="dim">${when(r.at)}</td><td>${esc(r.target_name)}</td><td style="white-space:normal;min-width:200px">${esc(r.text)}</td><td>${esc(r.room)}</td><td>${esc(r.by_name)}</td><td>${(r.muted_until || 0) > Date.now() ? '🔇 ใช่' : '-'}</td></tr>`).join('') || '<tr><td colspan="6" class="dim">ไม่มีรายงาน</td></tr>'}</table></div>`;
    } else if (tab === 'econ') {
      const d = await api('/admin/econ?days=' + econDays);
      main.innerHTML = econHtml(d);
      main.querySelectorAll('button[data-days]').forEach(b => b.onclick = () => { econDays = Number(b.dataset.days); show(); });
    } else if (tab === 'flags') {
      const d = await api('/admin/flags');
      main.innerHTML = `<p class="dim">สิ่งที่ระบบกันโกงจับได้ (ทอง/เลเวลพุ่งผิดปกติ, แก้เพชร/VIP เอง) และสิ่งที่แอดมินทำ</p><div class="tw"><table><tr><th>เมื่อ</th><th>ผู้เล่น</th><th>เรื่อง</th><th>รายละเอียด</th></tr>${d.rows.map(f => `<tr class="click" data-id="${esc(f.id)}"><td class="dim">${when(f.at)}</td><td>${esc(f.name || f.id)}</td><td>${esc(f.what)}</td><td style="white-space:normal">${esc(f.detail)}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">ไม่มี</td></tr>'}</table></div>`;
    }
    $('upd').textContent = new Date().toLocaleTimeString('th-TH');
  } catch (e) {
    main.innerHTML = e.message === 'admin' ? '<div class="msg">⛔ บัญชีในเครื่องนี้ไม่ใช่แอดมิน<br>เปิดเกมแล้วล็อกอิน Google ด้วยบัญชีแอดมินก่อน</div>' : `<div class="msg">โหลดไม่สำเร็จ (${esc(e.message)}) — ลองใหม่อีกครั้ง</div>`;
  }
}
main.onclick = e => { const a = e.target.closest('[data-go]'); if (a) { go(a.dataset.go); return; } const tr = e.target.closest('tr.click'); if (tr) player(tr.dataset.id); };
// the UID box (director): a player copies the ID from their profile and sends it — paste it here to open them (gift form inside)
$('uidGo').onclick = async () => { const id = $('uid').value.trim().replace(/^ID[:\s]*/i, ''); if (!id) { alert('ใส่รหัสผู้เล่นก่อน'); return; } try { const d = await api('/admin/player?id=' + encodeURIComponent(id)); if (!d.acc) { alert('ไม่พบผู้เล่นรหัสนี้ — ตรวจว่าคัดลอกมาครบไหม'); return; } player(id); } catch { alert('เปิดไม่สำเร็จ'); } };
$('uid').onkeydown = e => { if (e.key === 'Enter') $('uidGo').click(); };
async function player(id) {
  const d = await api('/admin/player?id=' + encodeURIComponent(id)), a = d.acc || {}, s = d.save?.data || {};
  $('dt').textContent = (a.name || '(ยังไม่ตั้งชื่อ)') + ' • Lv' + (a.lv ?? '-');
  const inv = (s.inventory || []).map(i => `${i.id}${i.upg ? '+' + i.upg : ''}${i.qty > 1 ? ' x' + i.qty : ''}`).join(', ');
  const muted = (a.muted_until || 0) > Date.now();
  $('dbody').innerHTML = `<div class="row">${tags(a)}</div>
    <div class="kv"><div>รหัสบัญชี</div><div>${esc(a.id)}</div><div>อาชีพ</div><div>${esc(CLS[s.cls] || s.cls)} ร่าง ${(s.tier ?? 0) + 1}</div>
    <div>ทอง</div><div>💰 ${num(s.gold)}</div><div>เพชร</div><div>💎 ${num(s.diamonds)}</div><div>VIP ถึง</div><div>${(s.vipUntil || 0) > Date.now() ? new Date(s.vipUntil).toLocaleString('th-TH') : '-'}</div>
    <div>ไม้ / หิน / อาหาร</div><div>${num(s.res?.wood)} / ${num(s.res?.stone)} / ${num(s.res?.food)}</div><div>กิลด์</div><div>${esc(s.guild?.name || '-')}</div>
    <div>เข้าล่าสุด</div><div>${when(a.seen)}</div><div>สมัคร</div><div>${when(a.created)}</div><div>เซฟล่าสุด</div><div>${when(d.save?.at)} (ครั้งที่ ${d.save?.rev ?? 0})</div></div>
    <h2>⚙ จัดการ</h2><div class="row">
      ${a.banned ? `<button class="btn green" data-a="unban">✅ ปลดแบน</button>` : `<button class="btn red" data-a="ban">⛔ แบน</button>`}
      ${muted ? `<button class="btn green" data-a="unmute">🔊 เปิดแชต</button>` : `<button class="btn" data-a="mute" data-h="24">🔇 ปิดแชต 24 ชม.</button><button class="btn" data-a="mute" data-h="168">🔇 ปิดแชต 7 วัน</button>`}</div>
    <h2>🤝 ชวนเพื่อน (${(d.refs || []).length} คน)</h2>
    <div style="font-size:13px">${(d.refs || []).map(r => `${esc(r.name || r.invitee)} • ${r.lv30 ? '✅ ถึง Lv30 (จ่ายแล้ว)' : r.lv10 ? 'ถึง Lv10' : 'ยังไม่ถึง Lv10'}`).join('<br>') || '<span class="dim">ยังไม่มี</span>'}</div>
    <div class="row" style="margin-top:6px"><input id="refFriend" placeholder="ชื่อหรือรหัสบัญชีเพื่อน" style="width:200px;background:#0f0b12;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px"><button class="btn" id="refAdd">➕ นับเป็นเพื่อนที่ชวน</button><button class="btn green" id="refWing">🪽 มอบปีกพายุอสนี (รางวัลชวนครบ)</button></div>
    <p class="dim" style="font-size:12px">ใช้กับกรณีที่ตรวจแล้วว่าเป็นเพื่อนจริง (เช่น อยู่หอเดียวกัน ใช้เน็ตเดียวกัน) • รางวัลเพชรจ่ายเองเมื่อเพื่อนถึงเงื่อนไข</p>
    <h2>🎁 ส่งของให้ผู้เล่นนี้ (เข้ากล่องจดหมายในเกม)</h2>
    <div class="row"><label>💰 ทอง <input type="number" min="0" id="gGold" style="width:100px"></label><label>🪵 ไม้ <input type="number" min="0" id="gWood" style="width:80px"></label>
      <label>🪨 หิน <input type="number" min="0" id="gStone" style="width:80px"></label><label>🍖 อาหาร <input type="number" min="0" id="gFood" style="width:80px"></label></div>
    <div class="row"><input list="itemList" id="gItem" placeholder="พิมพ์ชื่อไอเทม..." style="width:220px"><datalist id="itemList">${(window.ITEMS || []).map(i => `<option value="${esc(i.name)} [${esc(i.id)}]">`).join('')}</datalist>
      <label>จำนวน <input type="number" min="1" max="999" value="1" id="gQty" style="width:60px"></label><button class="btn" id="gAdd">➕ เพิ่ม</button></div>
    <div id="gList" class="dim" style="font-size:13px;margin-bottom:6px">ยังไม่ได้เลือกไอเทม</div>
    <div class="row"><input id="gNote" placeholder="ข้อความถึงผู้เล่น (ไม่ใส่ก็ได้) เช่น ชดเชยบั๊กอาคารหาย" style="width:min(420px,100%)"><button class="btn green" id="gSend">🎁 ส่งของ</button></div>
    <h2>🎒 กระเป๋า (${(s.inventory || []).length})</h2><div style="font-size:13px">${esc(inv) || '<span class="dim">ว่าง</span>'}</div>
    <h2>🚩 ถูกรายงาน (${d.reports.length})</h2>${d.reports.map(r => `<div style="font-size:13px"><span class="dim">${when(r.at)} • ${esc(r.by_name)}:</span> ${esc(r.text)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>💰 ที่มาของทอง 7 วัน (เริ่มบันทึก 13 พ.ย.)</h2>${(d.econ || []).length ? `<div class="tw"><table style="min-width:420px"><tr><th>แหล่ง</th><th>ทองเข้า</th><th>ทองออก</th><th>💎</th><th>🪵/🪨/🍖</th><th>ครั้ง</th></tr>${d.econ.map(r => `<tr><td>${srcName(r.src)}</td><td>${r.g_in ? num(r.g_in) : '-'}</td><td>${r.g_out ? num(r.g_out) : '-'}</td><td>${r.d_in || r.d_out ? num(r.d_in) + ' / ' + num(r.d_out) : '-'}</td><td>${sgn(r.wood)} / ${sgn(r.stone)} / ${sgn(r.food)}</td><td>${num(r.n)}</td></tr>`).join('')}<tr><td><b>รวม</b></td><td><b>${num(d.econ.reduce((t, r) => t + r.g_in, 0))}</b></td><td><b>${num(d.econ.reduce((t, r) => t + r.g_out, 0))}</b></td><td colspan="3"></td></tr></table></div>` : '<span class="dim">ยังไม่มีข้อมูล</span>'}
    <h2>🛡 กันโกง (${d.flags.length})</h2>${d.flags.map(f => `<div style="font-size:13px"><span class="dim">${when(f.at)}</span> ${esc(f.what)} — ${esc(f.detail)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>🏪 ของที่ลงขาย (${d.market.length})</h2>${d.market.map(m => `<div style="font-size:13px">${esc((() => { try { return JSON.parse(m.item).id; } catch { return '?'; } })())} • 💰 ${num(m.price)} • ${esc(m.status)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>🧾 ข้อมูลตัวละครทั้งหมด</h2><pre>${esc(JSON.stringify(s, null, 1))}</pre>`;
  $('dbody').querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    const what = b.dataset.a, label = b.textContent.trim();
    if (!confirm(`ยืนยัน "${label}" กับ ${a.name || a.id}?`)) return;
    const r = await api('/admin/act', { id: a.id, what, hours: Number(b.dataset.h) || 24 });
    if (r.ok) { player(id); if (tab !== 'overview') show(); } else alert('ทำไม่สำเร็จ: ' + (r.error || '?'));
  });
  $('refAdd').onclick = async () => { const f = $('refFriend').value.trim(); if (!f) return alert('ใส่ชื่อหรือรหัสบัญชีเพื่อน'); if (!confirm(`นับ "${f}" เป็นเพื่อนที่ ${a.name || a.id} ชวน?`)) return; const r = await api('/admin/act', { id: a.id, what: 'refadd', friend: f }); if (r.ok) player(id); else alert('ทำไม่สำเร็จ: ' + (r.error || '?')); };
  $('refWing').onclick = async () => { if (!confirm(`มอบปีกพายุอสนี (Limited) ให้ ${a.name || a.id}?`)) return; const r = await api('/admin/act', { id: a.id, what: 'refwing' }); if (r.ok) { alert('ส่งปีกแล้ว ✅'); player(id); } else alert('ทำไม่สำเร็จ: ' + (r.error || '?')); };
  // the gift form: resources + a list of items, sent in one go after a confirmation
  const pick = []; const drawPick = () => { $('gList').textContent = pick.length ? 'จะส่ง: ' + pick.map(p => `${p.name} x${p.qty}`).join(', ') : 'ยังไม่ได้เลือกไอเทม'; };
  $('gAdd').onclick = () => { const v = $('gItem').value, m = v.match(/\[([^\]]+)\]$/), it = (window.ITEMS || []).find(i => i.id === (m ? m[1] : v) || i.name === v); if (!it) { alert('ไม่พบไอเทมนี้ — เลือกจากรายการที่ขึ้นมา'); return; } pick.push({ id: it.id, name: it.name, qty: Math.max(1, Math.min(999, Number($('gQty').value) || 1)) }); $('gItem').value = ''; drawPick(); };
  $('gSend').onclick = async () => {
    const g = { id: a.id, gold: Number($('gGold').value) || 0, wood: Number($('gWood').value) || 0, stone: Number($('gStone').value) || 0, food: Number($('gFood').value) || 0, items: pick.map(p => ({ id: p.id, qty: p.qty })), note: $('gNote').value.trim() };
    const sum = [g.gold && `💰 ${num(g.gold)}`, g.wood && `🪵 ${num(g.wood)}`, g.stone && `🪨 ${num(g.stone)}`, g.food && `🍖 ${num(g.food)}`, ...pick.map(p => `${p.name} x${p.qty}`)].filter(Boolean);
    if (!sum.length) { alert('ยังไม่ได้ใส่ของที่จะส่ง'); return; }
    if (!confirm(`ส่งเข้ากล่องจดหมายของ ${a.name || a.id}:\n${sum.join('\n')}\n\nยืนยัน?`)) return;
    const r = await api('/admin/give', g);
    if (r.ok) { alert('✅ ส่งแล้ว\n' + r.text); player(id); } else alert('ส่งไม่สำเร็จ: ' + (r.error === 'nosave' || r.error === 'target' ? 'ผู้เล่นนี้ยังไม่มีตัวละครบนเซิร์ฟ' : r.error === 'empty' ? 'ไม่มีอะไรส่งได้ (กระเป๋าเต็ม?)' : r.error));
  };
  if (!$('dlg').open) $('dlg').showModal();
}
api('/admin/items').then(d => { window.ITEMS = d.items; }).catch(() => {});
show();
</script>
